name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.BOT_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please creates its commits through the REST API, which cannot produce
      # GPG signatures, but the branch ruleset requires verified signatures on every
      # PR commit. Re-sign the release PR commit with the bot's key (same key and
      # setup as logto-io/js).
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.BOT_PAT }}

      - name: Import bot GPG key
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Sign the release PR commit
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          # Only amend truly unsigned commits ("N"); a manually re-signed commit
          # ("E"/"U"/"G") is left alone so checks are not re-triggered for nothing.
          if [ "$(git log -1 --format=%G?)" != "N" ]; then
            echo "Release PR head commit is already signed, nothing to do"
            exit 0
          fi
          git config user.name silverhand-bot
          git config user.email bot@silverhand.io
          git commit --amend --no-edit --gpg-sign
          git push --force

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish artifacts to staging
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
        run: ./gradlew :kotlin-sdk:kotlin:publish :android-sdk:android:publish

      - name: Promote staging to deployment with auto-release
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w 0)
          curl --fail-with-body -X POST \
            -H "Authorization: Basic $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.logto.sdk?publishing_type=automatic"

name: Release

on:
  push:
    branches:
      - v2.x
      - 'release-please--branches--**'

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/v2.x'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.BOT_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without this, release-please falls back to the repository default
          # branch (master) and never builds a release PR for this branch.
          target-branch: v2.x

  # The branch ruleset requires verified signatures on every PR commit, but two
  # paths put unsigned commits on the release branch: release-please creates its
  # commits through the REST API (which cannot sign), and the "Update branch"
  # rebase button rewrites the commit unsigned. Reacting to pushes on the release
  # branch itself covers both: whenever its head commit is unsigned, amend it with
  # the bot's GPG key (same key and setup as logto-io/js).
  sign-release-branch:
    if: startsWith(github.ref_name, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          # Amending in the default shallow clone rewrites the head commit into a
          # parentless orphan (its parents are behind the shallow boundary) — the
          # full history is required for the amend to keep the parent.
          fetch-depth: 0

      - name: Import bot GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Sign the head commit when unsigned
        run: |
          # Only amend truly unsigned commits ("N"); an already-signed commit
          # ("E"/"U"/"G") is left alone so this job does not retrigger itself.
          if [ "$(git log -1 --format=%G?)" != "N" ]; then
            echo "Head commit is already signed, nothing to do"
            exit 0
          fi
          git config user.name silverhand-bot
          git config user.email bot@silverhand.io
          git commit --amend --no-edit --gpg-sign
          # Never push a history rewrite: the amended commit must keep its parent
          # (an empty %P means the orphan bug above — abort instead of clobbering
          # the branch and auto-closing the release PR).
          if [ -z "$(git log -1 --format=%P)" ]; then
            echo "Amended commit lost its parent; refusing to push" >&2
            exit 1
          fi
          git push --force origin HEAD:${{ github.ref_name }}

  # GitHub marks the most recently created release as "Latest" by default, so a
  # maintenance release cut here would steal the badge from the v3 line — and
  # PATCHing the new release with make_latest=false does NOT demote a release
  # that has already taken the badge (verified on v2.0.3). Assert the badge in
  # the working direction instead: re-mark the highest stable version. While no
  # v3 GA exists, the maintenance release IS the highest stable and correctly
  # keeps the badge.
  ensure-latest:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep "Latest" on the highest stable release
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          highest=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == false and .draft == false
                               and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
                  | max_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber))
                  | .tag_name')
          if [ "$highest" = "${{ needs.release-please.outputs.tag_name }}" ]; then
            echo "This release ($highest) is the highest stable version and correctly keeps Latest"
            exit 0
          fi
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/$highest" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -f make_latest=true
          echo "Latest re-pointed at $highest"

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish artifacts to staging
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
        run: ./gradlew :kotlin-sdk:kotlin:publish :android-sdk:android:publish

      - name: Promote staging to deployment with auto-release
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w 0)
          curl --fail-with-body -X POST \
            -H "Authorization: Basic $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.logto.sdk?publishing_type=automatic"

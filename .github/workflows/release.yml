name: Release

on:
  push:
    branches: [v2.x]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.BOT_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without this, release-please falls back to the repository default
          # branch (master) and never builds a release PR for this branch.
          target-branch: v2.x

  # GitHub marks the most recently created release as "Latest" by default,
  # so a maintenance release cut here would steal the badge from the v3 line.
  unmark-latest:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Unmark this release as latest
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ needs.release-please.outputs.tag_name }}" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$release_id" -f make_latest=false

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish artifacts to staging
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
        run: ./gradlew :kotlin-sdk:kotlin:publish :android-sdk:android:publish

      - name: Promote staging to deployment with auto-release
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w 0)
          curl --fail-with-body -X POST \
            -H "Authorization: Basic $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.logto.sdk?publishing_type=automatic"
